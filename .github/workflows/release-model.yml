name: Release exported model

on:
  push:
    branches: [main]
    paths:
      - "export/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package export folder
        run: zip -r export.zip export

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha=$(git rev-parse --short HEAD)
          tag="model-$(date -u +%Y-%m-%d)-${short_sha}"
          notes=$(printf 'Exported model from commit %s\n\n%s' "$GITHUB_SHA" "$(git log -1 --format=%B)")
          gh release create "$tag" \
            export/* export.zip \
            --title "Model $tag" \
            --notes "$notes" \
            --target "$GITHUB_SHA" \
            --latest
